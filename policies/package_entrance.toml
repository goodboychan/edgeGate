# Deployment policy for "Tell me when a package is left at the entrance".
# The rule engine (edgegate/gate.py) decides PASS/HOLD per backend from this file
# and the measurement records. Anything missing, stale, NaN or failed is a HOLD.
# Threshold values are placeholders until the eval set exists (10/28).

[task]
name = "package-at-entrance"
instruction = "Tell me when a package is left at the entrance."
# Where and when the skill runs. The audit agent reads this; the rules do not.
context = "Indoor staged drop zone in a room, standing in for the entrance. The camera watches around the clock, including evenings and nights with the room lights low."
# sha256 of the eval set manifest; records measured on anything else are rejected.
eval_set_sha256 = "unset"
# Measurements older than this are stale.
max_age_hours = 24
# Backend whose record is the accuracy reference for max_drop checks.
reference_backend = "onnx-gx10"

# Deployment target per backend: a record counts only if it was measured on this
# device with this runtime. device_id is sha256("edgegate:" + /etc/machine-id)[:32],
# so the raw machine id never leaves the device (scripts/run_backend.py). A new
# device, a reinstalled OS or a runtime upgrade means measuring again.
[targets]
onnx-gx10 = { device_id = "f2c8a7b13d7e38457fbe9cf87fe9120e", runtime = "onnxruntime 1.31.1" }
trt = { device_id = "28e2cf10ddf70d2ef8221c82c013d27d", runtime = "tensorrt 10.3.0" }
hailo8 = { device_id = "8db76e25b0fb515f0893a1d0c62e06d7", runtime = "hailort 4.20.0" }

# How the device output is read. Hashed with [events] into eval_config_sha256.
[measure]
classes = ["package", "person"]  # model output order (scripts/train_student.py)
det_conf = 0.25                  # detections below this are dropped on the device

# How per-frame detections become arrival alerts (edgegate/events.py).
# Fixed for the first version (10/27): not tuned values. Check false alerts, misses
# and delays on real sessions; change them only before an evaluation, never after.
[events]
# Normalized [0, 1] polygon; a box counts when its bottom-center is inside.
# Drawn on the mounted camera (10/29) before any session was recorded: from the
# doorway threshold over the light floor and the front of the gray mat, clear of
# the fixed boxes and bag on the left and the desk on the right. The door stays open.
zone = [[0.39, 0.5625], [0.54, 0.5625], [0.69, 0.72], [0.69, 0.92], [0.37, 0.92]]
score_min = 0.5
dwell_s = 2.0        # package seen this long in an empty zone = arrival
gap_s = 1.0          # missed detections shorter than this do not restart the dwell
clear_s = 2.0        # zone empty (not hidden) this long = package removed
hidden_overlap = 0.3 # a person box covering this much of the package = hidden, not empty
reconnect_s = 2.0    # no frames this long = camera away, zone state unknown
match_window_s = 10.0  # release to alert received, dwell included
notify_s = 0.0       # measured alert delivery delay, added before the 10 s check
# Until the live path is measured (release -> inference -> event -> alert received),
# notify_s is not a measurement and the gate holds every backend.
notify_measured = false

# min / max are absolute limits; max_drop is the allowed drop below the reference.
[thresholds]
event_recall = { min = 0.9, max_drop = 0.05 }
false_alerts_per_h = { max = 1.0 }
duplicate_alerts = { max = 0 }
detection_delay_s_p95 = { max = 5.0 }
latency_ms_p95 = { max = 100.0 }
peak_mem_mb = { max = 2048.0 }

# Per-backend overrides replace the whole entry for that metric.
[backends.hailo8]
latency_ms_p95 = { max = 50.0 }

# Audit slices (edgegate/audit.py). The rules never read these; they only group
# the per-event results the audit agent can ask for. Fixed before evaluation.
[slices]
# Package size = sqrt(box area) as a fraction of the frame, from the marked box:
# small < 0.08 <= medium < 0.15 <= large; events without a marked box are "unknown".
size_edges = [0.08, 0.15]
